<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning Congés 2026</title>
  <style>
    :root {
      --bg:       #f1f5f9;
      --card:     #ffffff;
      --text:     #0f172a;
      --muted:    #64748b;
      --border:   #e2e8f0;
      --track-bg: #f8fafc;
      --today:    #ef4444;
      --name-w:   150px;
      --row-h:    42px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2.5rem 2rem;
      min-height: 100vh;
    }

    /* ── Page header ── */
    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      margin: 0.3rem 0 2rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(15,23,42,.06), 0 8px 32px rgba(15,23,42,.08);
      padding: 1.75rem 2rem 1.5rem;
    }
    .scroll-wrap { overflow-x: auto; }
    .tl { min-width: 720px; }

    /* ── Shared row layout ── */
    .row { display: flex; align-items: center; }
    .name-col { width: var(--name-w); flex-shrink: 0; }
    .track-col { flex: 1; position: relative; }

    /* ── Month header ── */
    .months-header { margin-bottom: 2px; }
    .months-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .month-cell {
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .month-cell + .month-cell { border-left: 1px solid var(--border); }

    /* ── Today label row ── */
    .today-row { height: 24px; margin-bottom: 6px; }
    .today-badge {
      position: absolute;
      top: 2px;
      transform: translateX(-50%);
      background: var(--today);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      white-space: nowrap;
    }

    /* ── Person rows ── */
    .person-row { margin-bottom: 8px; }
    .person-name {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      font-size: 0.83rem;
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Timeline bar ── */
    .bar {
      height: var(--row-h);
      background: var(--track-bg);
      border-radius: 8px;
      position: relative;
      overflow: visible;
    }
    .sep {
      position: absolute;
      top: -5px;
      bottom: -5px;
      width: 1px;
      background: var(--border);
      pointer-events: none;
    }
    .today-line {
      position: absolute;
      top: -5px;
      bottom: -5px;
      width: 2px;
      background: var(--today);
      border-radius: 2px;
      pointer-events: none;
      z-index: 4;
    }

    /* ── Vacation block ── */
    .vac {
      position: absolute;
      top: 4px;
      bottom: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      cursor: default;
      transition: filter .15s ease, box-shadow .15s ease, transform .1s ease;
    }
    .vac:hover {
      filter: brightness(0.86);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      transform: scaleY(1.1);
      z-index: 10;
    }
    .vac-label {
      font-size: 0.63rem;
      font-weight: 700;
      color: rgba(0,0,0,.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 5px;
      pointer-events: none;
    }

    /* Tooltip */
    .tip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 50;
    }
    .tip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: #0f172a;
    }
    .vac:hover .tip { opacity: 1; }

    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 2rem;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
    }
    .legend-swatch {
      width: 22px;
      height: 10px;
      border-radius: 3px;
    }
    .legend-today-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--today);
    }
    .legend-today-bar {
      width: 2px;
      height: 14px;
      background: var(--today);
      border-radius: 2px;
    }
  </style>
</head>
<body>

<h1>Planning des Congés 2026</h1>
<p class="subtitle">Janvier → Décembre · Équipe de 6 personnes</p>

<div class="card">
  <div class="scroll-wrap">
    <div class="tl" id="tl"></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<script>
  // ── Data ────────────────────────────────────────────────────────────────────
  // Timeline: Jan 1 → Dec 31, 2026  (365 days total)
  // Day offsets are 0-based from Jan 1  (Jan 1 = 0, Jan 2 = 1 …)

  const TOTAL = 365;
  const TODAY = 126; // May 7, 2026

  const MONTHS = [
    { name: 'Jan.',      days: 31, start: 0   },
    { name: 'Fév.',      days: 28, start: 31  },
    { name: 'Mar.',      days: 31, start: 59  },
    { name: 'Avr.',      days: 30, start: 90  },
    { name: 'Mai',       days: 31, start: 120 },
    { name: 'Juin',      days: 30, start: 151 },
    { name: 'Juil.',     days: 31, start: 181 },
    { name: 'Août',      days: 31, start: 212 },
    { name: 'Sep.',      days: 30, start: 243 },
    { name: 'Oct.',      days: 31, start: 273 },
    { name: 'Nov.',      days: 30, start: 304 },
    { name: 'Déc.',      days: 31, start: 334 },
  ];

  // s = start day offset (inclusive), e = end day offset (inclusive)
  // End dates from user are exclusive (return day) → last vacation day = end − 1
  // Vacations starting before Jan 1 are clipped to offset 0
  // Vacations ending after Dec 31 are clipped to offset 364
  const PEOPLE = [
    {
      name: 'Jon',
      color: '#c7d2fe', // bleu lavande
      vacations: [
        { s: 0,   e: 3,   label: '01 – 04 jan.'         }, //  4 j. (déb. 20 déc.)
        { s: 105, e: 115, label: '16 – 26 avr.'         }, // 11 j.
        { s: 116, e: 150, label: '27 avr. – 31 mai'     }, // 35 j.
        { s: 151, e: 171, label: '01 – 21 juin'         }, // 21 j.
        { s: 172, e: 180, label: '22 – 30 juin'         }, //  9 j.
      ],
    },
    {
      name: 'Julie',
      color: '#fbcfe8', // rose clair
      vacations: [
        { s: 0,   e: 3,   label: '01 – 04 jan.'         }, //  4 j. (déb. 17 déc.)
        { s: 43,  e: 45,  label: '13 – 15 fév.'         }, //  3 j.
        { s: 64,  e: 66,  label: '06 – 08 mar.'         }, //  3 j.
        { s: 85,  e: 87,  label: '27 – 29 mar.'         }, //  3 j.
        { s: 130, e: 145, label: '11 – 26 mai'          }, // 16 j.
        { s: 193, e: 199, label: '13 – 19 juil.'        }, //  7 j.
        { s: 221, e: 228, label: '10 – 17 août'         }, //  8 j.
        { s: 312, e: 325, label: '09 – 22 nov.'         }, // 14 j.
        { s: 350, e: 364, label: '17 – 31 déc.'         }, // 15 j.
      ],
    },
    {
      name: 'Julien',
      color: '#bfdbfe', // bleu clair
      vacations: [
        { s: 134, e: 136, label: '15 – 17 mai'          }, //  3 j.
        { s: 193, e: 194, label: '13 – 14 juil.'        }, //  2 j.
        { s: 200, e: 213, label: '20 juil. – 02 août'   }, // 14 j.
      ],
    },
    {
      name: 'Laurie',
      color: '#fef08a', // jaune clair
      vacations: [
        { s: 1,   e: 6,   label: '02 – 07 jan.'         }, //  6 j.
        { s: 113, e: 115, label: '24 – 26 avr.'         }, //  3 j.
        { s: 116, e: 116, label: '27 avr.'              }, //  1 j.
        { s: 118, e: 123, label: '29 avr. – 04 mai'     }, //  6 j.
        { s: 124, e: 125, label: '05 – 06 mai'          }, //  2 j.
        { s: 134, e: 136, label: '15 – 17 mai'          }, //  3 j.
        { s: 193, e: 194, label: '13 – 14 juil.'        }, //  2 j.
        { s: 281, e: 297, label: '09 – 25 oct.'         }, // 17 j.
      ],
    },
    {
      name: 'Phil',
      color: '#fed7aa', // orange clair
      vacations: [
        { s: 29,  e: 33,  label: '30 jan. – 03 fév.'    }, //  5 j.
        { s: 53,  e: 54,  label: '23 – 24 fév.'         }, //  2 j.
        { s: 64,  e: 66,  label: '06 – 08 mar.'         }, //  3 j.
        { s: 110, e: 110, label: '21 avr.'              }, //  1 j.
        { s: 130, e: 131, label: '11 – 12 mai'          }, //  2 j.
        { s: 134, e: 136, label: '15 – 17 mai'          }, //  3 j.
        { s: 169, e: 171, label: '19 – 21 juin'         }, //  3 j.
        { s: 181, e: 186, label: '01 – 06 juil.'        }, //  6 j.
        { s: 193, e: 194, label: '13 – 14 juil.'        }, //  2 j.
        { s: 204, e: 213, label: '24 juil. – 02 août'   }, // 10 j.
        { s: 223, e: 235, label: '12 – 24 août'         }, // 13 j.
        { s: 298, e: 304, label: '26 oct. – 01 nov.'    }, //  7 j.
        { s: 361, e: 364, label: '28 – 31 déc.'         }, //  4 j.
      ],
    },
    {
      name: 'Vincent',
      color: '#a7f3d0', // vert clair
      vacations: [
        { s: 0,   e: 3,   label: '01 – 04 jan.'         }, //  4 j. (déb. 31 déc.)
        { s: 81,  e: 81,  label: '23 mar.'              }, //  1 j.
        { s: 126, e: 129, label: '07 – 10 mai'          }, //  4 j.
        { s: 134, e: 136, label: '15 – 17 mai'          }, //  3 j.
        { s: 145, e: 152, label: '26 mai – 02 juin'     }, //  8 j.
        { s: 193, e: 194, label: '13 – 14 juil.'        }, //  2 j.
        { s: 195, e: 199, label: '15 – 19 juil.'        }, //  5 j.
        { s: 207, e: 220, label: '27 juil. – 09 août'   }, // 14 j.
        { s: 273, e: 278, label: '01 – 06 oct.'         }, //  6 j.
        { s: 354, e: 364, label: '21 – 31 déc.'         }, // 11 j.
      ],
    },
  ];

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function pct(offset) {
    return (offset / TOTAL * 100).toFixed(4) + '%';
  }

  function mk(tag, cls, styles) {
    const e = document.createElement(tag);
    if (cls)    e.className = cls;
    if (styles) Object.assign(e.style, styles);
    return e;
  }

  function addSeparators(bar) {
    MONTHS.forEach(m => {
      if (m.start === 0) return;
      bar.appendChild(mk('div', 'sep', { left: pct(m.start) }));
    });
  }

  // ── Build timeline ────────────────────────────────────────────────────────────
  const tl = document.getElementById('tl');

  // 1. Month header row
  const headerRow = mk('div', 'row months-header');
  headerRow.appendChild(mk('div', 'name-col'));
  const headerTrack = mk('div', 'track-col');
  const monthsBar = mk('div', 'months-bar');
  MONTHS.forEach(m => {
    const cell = mk('div', 'month-cell');
    cell.textContent = m.name;
    cell.style.flex = m.days;
    monthsBar.appendChild(cell);
  });
  headerTrack.appendChild(monthsBar);
  headerRow.appendChild(headerTrack);
  tl.appendChild(headerRow);

  // 2. "Aujourd'hui" badge row
  const todayRow = mk('div', 'row today-row');
  todayRow.appendChild(mk('div', 'name-col'));
  const todayTrack = mk('div', 'track-col');
  const badge = mk('div', 'today-badge');
  badge.textContent = "Aujourd'hui";
  badge.style.left = pct(TODAY + 0.5);
  todayTrack.appendChild(badge);
  todayRow.appendChild(todayTrack);
  tl.appendChild(todayRow);

  // 3. Person rows
  PEOPLE.forEach(person => {
    const personRow = mk('div', 'row person-row');

    // Name column
    const nameWrapper = mk('div', 'name-col');
    const nameDiv     = mk('div', 'person-name');
    const dot         = mk('span', 'dot', { background: person.color });
    nameDiv.appendChild(dot);
    nameDiv.appendChild(document.createTextNode(person.name));
    nameWrapper.appendChild(nameDiv);
    personRow.appendChild(nameWrapper);

    // Bar
    const bar = mk('div', 'bar track-col');

    addSeparators(bar);
    bar.appendChild(mk('div', 'today-line', { left: pct(TODAY + 0.5) }));

    // Vacation blocks
    person.vacations.forEach(v => {
      const dur   = v.e - v.s + 1;
      const block = mk('div', 'vac', {
        left:       pct(v.s),
        width:      pct(dur),
        background: person.color,
      });

      // Inline label — only for wide-enough blocks
      if (dur >= 10) {
        const lbl = mk('span', 'vac-label');
        lbl.textContent = v.label;
        block.appendChild(lbl);
      }

      // Tooltip (always visible on hover)
      const tip = mk('div', 'tip');
      tip.textContent = `${v.label} · ${dur} j.`;
      block.appendChild(tip);

      bar.appendChild(block);
    });

    personRow.appendChild(bar);
    tl.appendChild(personRow);
  });

  // ── Legend ───────────────────────────────────────────────────────────────────
  const legend = document.getElementById('legend');

  PEOPLE.forEach(person => {
    const item   = mk('div', 'legend-item');
    const swatch = mk('div', 'legend-swatch', { background: person.color });
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(person.name));
    legend.appendChild(item);
  });

  const todayItem = mk('div', 'legend-today-item');
  todayItem.appendChild(mk('div', 'legend-today-bar'));
  todayItem.appendChild(document.createTextNode("Aujourd'hui · 7 mai 2026"));
  legend.appendChild(todayItem);
</script>

</body>
</html>
